name: Beam CI

# Same principle as the GitLab fleet lanes: the build runs on a LOCAL
# self-hosted runner (beam-ci-025) against the LOCAL toolchain — system
# OTP 28 + Elixir 1.19 + rebar3, never a downloaded runtime. The beam/
# umbrella has zero hex deps, so this gate is fully offline-capable.
#
# push/workflow_dispatch only: this is a PUBLIC repo and the runner is
# self-hosted, so pull_request must never trigger it (fork-PR code
# execution) — same ruling as the caddy repo.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beam-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beam:
    name: beam/ umbrella (format + compile + tests)
    runs-on: [self-hosted, beam-ci]
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Local toolchain probe (fail loudly if the host loses BEAM)
        run: |
          erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)])' -eval 'halt().'
          elixir --version | tail -2
          rebar3 --version
      - name: Format check
        working-directory: beam
        run: mix format --check-formatted
      - name: Compile
        working-directory: beam
        run: mix compile
      - name: Tests + doctests (all umbrella apps)
        working-directory: beam
        run: mix test
