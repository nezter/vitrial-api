services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: vitrial
      POSTGRES_USER: vitrial
      POSTGRES_PASSWORD: vitrial
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrial -d vitrial"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3:
    # MinIO's prebuilt images are no longer published anywhere (401 on quay.io and
    # Docker Hub, 410 from dl.min.io). RustFS serves the same S3 API.
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: vitrials3secret
      RUSTFS_SECRET_KEY: vitrials3secret
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    depends_on:
      s3-permissions:
        condition: service_completed_successfully

  # RustFS runs as UID 10001, so a fresh named volume must be chowned first.
  s3-permissions:
    image: alpine:3.20
    command: ["sh", "-ec", "chown -R 10001:10001 /data"]
    volumes:
      - s3-data:/data
    restart: "no"

volumes:
  postgres-data:
  s3-data:
