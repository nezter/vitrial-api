name: vitrial-api-production

x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_NULL_POOL: ${DATABASE_NULL_POOL:-false}
  SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
  API_VERSION: v1
  ADMIN_API_KEY_HASH: ${ADMIN_API_KEY_HASH:-}
  EVIDENCE_STORAGE_PROVIDER: s3
  EVIDENCE_GC_GRACE_SECONDS: ${EVIDENCE_GC_GRACE_SECONDS:-86400}
  EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-104857600}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PART_SIZE_BYTES: ${S3_PART_SIZE_BYTES:-5242880}

services:
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    networks: [backend]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "scripts/probe_dependencies.py", "--quiet"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
    networks: [backend]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
