name: vitrial-api-acceptance

x-api-environment: &api-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_NULL_POOL: ${DATABASE_NULL_POOL:-false}
  SERVICE_VERSION: ${SERVICE_VERSION:?SERVICE_VERSION is required}
  API_VERSION: v1
  ADMIN_API_KEY_HASH: ${ADMIN_API_KEY_HASH:?ADMIN_API_KEY_HASH is required for acceptance provisioning}
  EVIDENCE_STORAGE_PROVIDER: s3
  EVIDENCE_GC_GRACE_SECONDS: ${EVIDENCE_GC_GRACE_SECONDS:-86400}
  S3_ENDPOINT_URL: http://s3:9000
  S3_ACCESS_KEY_ID: ${S3_ROOT_USER:?S3_ROOT_USER is required}
  S3_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PART_SIZE_BYTES: ${S3_PART_SIZE_BYTES:-5242880}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitrial}
      POSTGRES_USER: ${POSTGRES_USER:-vitrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    networks: [backend]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO's distribution has been withdrawn: 401 on quay.io and Docker Hub, and
  # 410 Gone from dl.min.io (verified 2026-09-28, with a library/alpine control
  # pull that succeeded, so it is MinIO's repositories specifically). RustFS is
  # a real S3 server -- the evidence storage layer's multipart upload path needs
  # genuine semantics -- and is Apache 2.0 rather than AGPL.
  s3:
    image: ${S3_IMAGE:?S3_IMAGE is required}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:?S3_ROOT_USER is required}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD is required}
      RUSTFS_VOLUMES: /data
    restart: unless-stopped
    networks: [backend]
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      s3-permissions:
        condition: service_completed_successfully

  # RustFS runs as UID 10001, so a fresh named volume is root-owned and the
  # server will not start until it is chowned. This mirrors the helper in
  # RustFS's own docker-compose-simple.yml.
  s3-permissions:
    image: alpine:3.20
    command: ["sh", "-ec", "chown -R 10001:10001 /data"]
    volumes:
      - s3-data:/data
    networks: [backend]
    restart: "no"

  # Bucket creation used to need the withdrawn minio/mc image. The API image
  # already carries boto3 and the S3 settings, so the init step runs there and
  # one fewer image has to remain pullable. The logic lives in
  # scripts/ensure_evidence_bucket.py so it is unit-testable rather than an
  # untestable blob inside this file.
  s3-init:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ["python", "scripts/ensure_evidence_bucket.py"]
    depends_on:
      s3:
        condition: service_healthy
    environment: *api-environment
    networks: [backend]
    restart: "no"

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "scripts/probe_dependencies.py", "--quiet"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 6

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
    networks: [backend]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  s3-data:
  caddy-data:
  caddy-config:
